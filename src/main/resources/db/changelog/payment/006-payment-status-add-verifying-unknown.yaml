databaseChangeLog:
  - changeSet:
      id: 006-payment-status-add-verifying-unknown
      author: benji-team
      comment: >
        Adds VERIFYING and UNKNOWN values to the payment_status enum (approved design decision B).
        VERIFYING = server-side verification in progress; UNKNOWN = gateway outcome uncertain after a
        timeout/network error (never terminal, always retried by callback replay or reconciliation job).
        PostgreSQL ALTER TYPE ... ADD VALUE cannot run inside a transaction block on older PG versions,
        so this changeset is executed outside a transaction.
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_enum e
              JOIN pg_type t ON t.oid = e.enumtypid
              WHERE t.typname = 'payment_status' AND e.enumlabel = 'VERIFYING'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: ALTER TYPE payment_status ADD VALUE IF NOT EXISTS 'VERIFYING'
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: ALTER TYPE payment_status ADD VALUE IF NOT EXISTS 'UNKNOWN'
      rollback:
        # Enum values cannot be removed in place; restore the original enum definition.
        - sql:
            dbms: postgresql
            sql: |
              UPDATE payment_transaction SET status = 'PENDING' WHERE status IN ('VERIFYING','UNKNOWN');
              ALTER TABLE payment_transaction ALTER COLUMN status TYPE VARCHAR(32);
              ALTER TABLE payment_transaction ALTER COLUMN status SET DEFAULT 'PENDING';
              DROP TYPE payment_status;
              CREATE TYPE payment_status AS ENUM ('PENDING','SUCCESS','FAILED','CANCELLED','REFUNDED');
              ALTER TABLE payment_transaction ALTER COLUMN status TYPE payment_status
                USING status::payment_status;
              ALTER TABLE payment_transaction ALTER COLUMN status SET DEFAULT 'PENDING';
