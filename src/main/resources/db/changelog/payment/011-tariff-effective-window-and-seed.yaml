databaseChangeLog:
  - changeSet:
      id: 011-tariff-add-effective-window
      author: benji-team
      comment: >
        Adds explicit validity window to tariff (design section 9). effective_from/effective_to are
        nullable; the partial unique index uk_tariff_one_active_per_service (changeset 007b) remains
        the primary "one active tariff per service type" guard. Application code additionally refuses
        to price a payment from a tariff whose effective_from is in the future or whose
        effective_to has passed, even if is_active was not yet flipped by an operator.
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            tableName: tariff
      changes:
        - addColumn:
            tableName: tariff
            columns:
              - column:
                  name: effective_from
                  type: timestamp with time zone
                  remarks: Inclusive start of applicability; NULL = immediately effective
              - column:
                  name: effective_to
                  type: timestamp with time zone
                  remarks: Exclusive end of applicability; NULL = open-ended
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE tariff
                ADD CONSTRAINT chk_tariff_effective_window
                CHECK (effective_to IS NULL OR effective_from IS NULL OR effective_to > effective_from);
      rollback:
        - sql:
            dbms: postgresql
            sql: ALTER TABLE tariff DROP CONSTRAINT IF EXISTS chk_tariff_effective_window;
        - dropColumn:
            tableName: tariff
            columnName: effective_from
        - dropColumn:
            tableName: tariff
            columnName: effective_to

  - changeSet:
      id: 012-seed-initial-tariffs
      author: benji-team
      comment: >
        Seeds the initial ACTIVE tariffs for the two MVP paid services (prices NEVER hard-coded in
        Java; they live in data and can be changed via admin API / new changesets). Amounts are in
        IRR Rials as NUMERIC(19,0) minor units — approved decision D ("all money values are IRR").
        Placeholder amounts below MUST be replaced with the business-approved prices before
        production release; sandbox seed uses identical structure.
        Insert is guarded so it only runs when no tariff exists yet for the MVP service types,
        keeping this changeset safe on databases where admins already created tariffs out of band.
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM tariff
              WHERE service_type IN ('LOST_PET_ADVERTISEMENT','EXPERT_CONSULTATION')
      changes:
        - insert:
            tableName: tariff
            columns:
              - column: {name: service_type, value: LOST_PET_ADVERTISEMENT}
              - column: {name: amount, value: "70000"}
              - column: {name: currency, value: IRR}
              - column: {name: is_active, value: "true"}
              - column: {name: activated_at, value: CURRENT_TIMESTAMP}
              - column: {name: created_at, value: CURRENT_TIMESTAMP}
              - column: {name: updated_at, value: CURRENT_TIMESTAMP}
        - insert:
            tableName: tariff
            columns:
              - column: {name: service_type, value: EXPERT_CONSULTATION}
              - column: {name: amount, value: "150000"}
              - column: {name: currency, value: IRR}
              - column: {name: is_active, value: "true"}
              - column: {name: activated_at, value: CURRENT_TIMESTAMP}
              - column: {name: created_at, value: CURRENT_TIMESTAMP}
              - column: {name: updated_at, value: CURRENT_TIMESTAMP}
      rollback:
        - delete:
            tableName: tariff
            where: currency = 'IRR' AND is_active = true AND service_type IN ('LOST_PET_ADVERTISEMENT','EXPERT_CONSULTATION')
