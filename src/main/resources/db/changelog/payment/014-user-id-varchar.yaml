databaseChangeLog:
  - changeSet:
      id: 014-user-id-columns-varchar
      author: benji-team
      comment: >
        User ids in this schema are VARCHAR(36) UUID-strings (tbl_users.id), not native uuid.
        Aligns payment columns with the actual user identifier type. Payment stores the id as an
        opaque value only — no FK to the user table by design (modular-monolith boundary).
      changes:
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE payment_transaction
                ALTER COLUMN user_id TYPE VARCHAR(64) USING user_id::text;
              ALTER TABLE payment_idempotency_key
                ALTER COLUMN user_id TYPE VARCHAR(64) USING user_id::text;
              ALTER TABLE payment_transaction
                ALTER COLUMN refunded_by_user_id TYPE VARCHAR(64) USING refunded_by_user_id::text;
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE payment_transaction
                ALTER COLUMN user_id TYPE UUID USING NULLIF(user_id,'')::uuid;
              ALTER TABLE payment_idempotency_key
                ALTER COLUMN user_id TYPE UUID USING NULLIF(user_id,'')::uuid;
              ALTER TABLE payment_transaction
                ALTER COLUMN refunded_by_user_id TYPE UUID USING NULLIF(refunded_by_user_id,'')::uuid;
