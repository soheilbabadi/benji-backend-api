databaseChangeLog:
  - changeSet:
      id: 010-drop-flawed-pending-unique-constraint
      author: benji-team
      comment: >
        Drops uk_payment_service_pending (service_type, service_reference_id, status) added by
        changeset 005. That constraint is wrong for the approved model "payment attempts are stored
        as separate transactions" (decision C): it would block a second FAILED/CANCELLED attempt for
        the same business operation and generally forbids the legitimate multi-attempt history.
        The real invariants are enforced instead by:
          - partial unique index: at most ONE active (PENDING/VERIFYING/UNKNOWN) attempt per op;
          - partial unique index: at most ONE SUCCESS per op (next changeset);
          - payment_idempotency_key table for duplicate initiation requests.
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_constraint
              WHERE conname = 'uk_payment_service_pending'
      changes:
        - sql:
            dbms: postgresql
            sql: ALTER TABLE payment_transaction DROP CONSTRAINT IF EXISTS uk_payment_service_pending;
      rollback:
        - sql:
            dbms: postgresql
            sql: >
              ALTER TABLE payment_transaction
                ADD CONSTRAINT uk_payment_service_pending
                UNIQUE (service_type, service_reference_id, status);

  - changeSet:
      id: 010b-one-active-attempt-per-business-operation
      author: benji-team
      comment: >
        At most one IN-FLIGHT payment attempt (PENDING, VERIFYING, or UNKNOWN) per business
        operation. A new attempt may only be created after the previous one reached a terminal
        state (FAILED/CANCELLED) — bounded retries, no runaway parallel checkouts.
      changes:
        - sql:
            dbms: postgresql
            sql: |
              CREATE UNIQUE INDEX uk_payment_one_active_attempt_per_op
                ON payment_transaction (service_type, service_reference_id)
                WHERE status IN ('PENDING','VERIFYING','UNKNOWN');
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP INDEX IF EXISTS uk_payment_one_active_attempt_per_op;

  - changeSet:
      id: 010c-one-success-per-business-operation
      author: benji-team
      comment: >
        Approved decision G: exactly one SUCCESSFUL payment per business operation, DB-enforced.
        Also makes duplicate/delayed callbacks harmless at the storage layer (a second SUCCESS row
        for the same op cannot be inserted).
      changes:
        - sql:
            dbms: postgresql
            sql: |
              CREATE UNIQUE INDEX uk_payment_one_success_per_op
                ON payment_transaction (service_type, service_reference_id)
                WHERE status = 'SUCCESS';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP INDEX IF EXISTS uk_payment_one_success_per_op;
