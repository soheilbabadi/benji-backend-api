databaseChangeLog:
  - changeSet:
      id: 009-payment-transaction-add-columns
      author: benji-team
      comment: >
        Adds columns required by the approved payment design:
          - public_token: client-facing identifier (API paths); internal UUID never exposed.
          - initiated_at / verified_at: lifecycle timestamps.
          - failure_code + sanitized diagnostic fields for support/reconciliation.
          - verify_attempts / last_verify_error: retry bookkeeping for UNKNOWN outcomes.
          - refund_reference_id / refunded_by_user_id: record-only MVP refunds (decision G).
        All nullable or defaulted so existing rows remain valid.
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            tableName: payment_transaction
      changes:
        - addColumn:
            tableName: payment_transaction
            columns:
              - column:
                  name: public_token
                  type: uuid
                  remarks: Public identifier exposed in REST API; never the internal PK
              - column:
                  name: initiated_at
                  type: timestamp with time zone
                  remarks: When gateway payment request was created (redirect URL issued)
              - column:
                  name: verified_at
                  type: timestamp with time zone
                  remarks: When server-side verification returned a final outcome
              - column:
                  name: failure_code
                  type: varchar(64)
                  remarks: Machine-readable failure code (e.g. GATEWAY_DECLINED, AUTHORITY_EXPIRED)
              - column:
                  name: diagnostic_info
                  type: text
                  remarks: Sanitized gateway diagnostics only; never merchant secrets or card data
              - column:
                  name: verify_attempts
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_verify_error
                  type: varchar(512)
                  remarks: Last verification error summary (for UNKNOWN/PENDING retry triage)
              - column:
                  name: refund_reference_id
                  type: varchar(100)
                  remarks: Gateway refund reference, if any (record-only refunds in MVP)
              - column:
                  name: refunded_by_user_id
                  type: uuid
                  remarks: Admin user who recorded the refund (no FK to user module by design)

  - changeSet:
      id: 009b-backfill-public-token
      author: benji-team
      comment: Backfills public_token for any existing rows using pgcrypto gen_random_uuid().
      changes:
        - sql:
            dbms: postgresql
            sql: |
              UPDATE payment_transaction
                 SET public_token = gen_random_uuid()
               WHERE public_token IS NULL;
      rollback:
        - sql:
            dbms: postgresql
            sql: UPDATE payment_transaction SET public_token = NULL;

  - changeSet:
      id: 009c-enforce-public-token-not-null-unique
      author: benji-team
      comment: Now that all rows have a token, enforce NOT NULL + UNIQUE on public_token.
      changes:
        - addNotNullConstraint:
            tableName: payment_transaction
            columnName: public_token
            columnDataType: uuid
        - addUniqueConstraint:
            tableName: payment_transaction
            constraintName: uk_payment_public_token
            columns: public_token
      rollback:
        - dropUniqueConstraint:
            tableName: payment_transaction
            constraintName: uk_payment_public_token
        - dropNotNullConstraint:
            tableName: payment_transaction
            columnName: public_token
            columnDataType: uuid
