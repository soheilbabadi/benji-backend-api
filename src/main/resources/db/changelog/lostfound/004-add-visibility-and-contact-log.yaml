databaseChangeLog:
  - changeSet:
      id: lostfound-004-add-include-in-search
      author: benji
      changes:
        - addColumn:
            tableName: lost_found_advertisement
            columns:
              - column:
                  name: include_in_search
                  type: boolean
                  defaultValueBoolean: true
                  constraints: { nullable: false }
      rollback:
        - dropColumn:
            tableName: lost_found_advertisement
            columnName: include_in_search

  # Contact reveal log (approved privacy decision): the advertiser's phone is MASKED on all
  # public reads; a visitor explicitly reveals it via POST /ads/{publicId}/contact. This table
  # records who revealed what, when — enabling abuse review without storing message content.
  - changeSet:
      id: lostfound-005-create-contact-reveal-log
      author: benji
      changes:
        - createTable:
            tableName: lost_found_contact_reveal_log
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: advertisement_id
                  type: uuid
                  constraints: { nullable: false }
              - column:
                  name: viewer_user_id
                  type: uuid
                  remarks: "NULL when an anonymous visitor reveals the contact."
              - column:
                  name: viewer_ip
                  type: varchar(45)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: lost_found_contact_reveal_log
            baseColumnNames: advertisement_id
            constraintName: fk_lf_reveal_advertisement
            referencedTableName: lost_found_advertisement
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            tableName: lost_found_contact_reveal_log
            indexName: idx_lf_reveal_ad_time
            columns:
              - column: { name: advertisement_id }
              - column: { name: created_at }
      rollback:
        - dropTable: { tableName: lost_found_contact_reveal_log }
