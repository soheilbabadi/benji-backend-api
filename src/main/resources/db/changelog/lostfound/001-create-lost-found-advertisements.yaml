databaseChangeLog:
  # Lost & Found advertisements. Owned exclusively by the lostfound module.
  # Cross-module references (user, pet, breed) are bare UUIDs WITHOUT foreign keys,
  # per the modular-monolith boundary rules; ownership/reference validity is enforced
  # in the service layer through module ports.
  - changeSet:
      id: lostfound-001-create-advertisements
      author: benji
      changes:
        - sql:
            sql: |
              CREATE TYPE lost_found_ad_type AS ENUM ('LOST', 'FOUND');
              CREATE TYPE lost_found_ad_status AS ENUM
                ('DRAFT', 'PAYMENT_PENDING', 'ACTIVE', 'RESOLVED', 'EXPIRED', 'CANCELLED', 'CLOSED', 'HIDDEN');
              CREATE TYPE lost_found_species AS ENUM ('DOG', 'CAT');
              CREATE TYPE lost_found_sex AS ENUM ('MALE', 'FEMALE', 'UNKNOWN');
              CREATE TYPE location_precision AS ENUM
                ('COUNTRY', 'CITY', 'NEIGHBORHOOD', 'STREET', 'EXACT_POINT');
              CREATE TYPE contact_method AS ENUM ('PHONE', 'IN_APP');
        - createTable:
            tableName: lost_found_advertisement
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: public_id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints: { nullable: false, unique: true }
              - column:
                  name: advertisement_type
                  type: lost_found_ad_type
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: lost_found_ad_status
                  constraints: { nullable: false }
              - column:
                  name: user_id
                  type: uuid
                  constraints: { nullable: false }
              - column:
                  name: pet_id
                  type: uuid
                  remarks: "Required for LOST (ownership verified server-side); always NULL for FOUND."
              - column:
                  name: species
                  type: lost_found_species
                  constraints: { nullable: false }
              - column:
                  name: breed_id
                  type: uuid
                  remarks: "Reference-data lookup id; nullable (mixed/unknown allowed). No FK by design."
              - column:
                  name: animal_name
                  type: varchar(100)
              - column:
                  name: sex
                  type: lost_found_sex
                  constraints: { nullable: false }
              - column:
                  name: color
                  type: varchar(100)
              - column:
                  name: distinguishing_characteristics
                  type: varchar(1000)
              - column:
                  name: description
                  type: varchar(2000)
                  constraints: { nullable: false }
              - column:
                  name: incident_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: country
                  type: varchar(64)
                  constraints: { nullable: false }
              - column:
                  name: city
                  type: varchar(100)
                  constraints: { nullable: false }
              - column:
                  name: area
                  type: varchar(150)
              - column:
                  name: latitude
                  type: numeric(9,6)
                  remarks: "Optional approximate incident location. NOT the advertiser's home address."
              - column:
                  name: longitude
                  type: numeric(9,6)
              - column:
                  name: location_precision
                  type: location_precision
                  constraints: { nullable: false }
              - column:
                  name: contact_method
                  type: contact_method
                  constraints: { nullable: false }
              - column:
                  name: contact_phone_e164
                  type: varchar(20)
                  remarks: "Ad-specific contact explicitly provided by the advertiser; distinct from account details. Masked on public reads until revealed via /contact."
              - column:
                  name: reward_amount_irr
                  type: numeric(19,0)
                  remarks: "Advertiser-declared reward (IRR Rials). Informational only; Benji does not process rewards."
              - column:
                  name: published_at
                  type: timestamptz
              - column:
                  name: expires_at
                  type: timestamptz
                  remarks: "published_at + 30 days (confirmed expiry duration)."
              - column:
                  name: resolved_at
                  type: timestamptz
              - column:
                  name: resolved_by_user_id
                  type: uuid
              - column:
                  name: resolution_note
                  type: varchar(500)
              - column:
                  name: closed_at
                  type: timestamptz
              - column:
                  name: hidden_reason
                  type: varchar(500)
                  remarks: "Set by moderation when status = HIDDEN."
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints: { nullable: false }
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
        - addCheckConstraint:
            tableName: lost_found_advertisement
            constraintName: chk_lf_lost_has_pet
            constraintCheck: "advertisement_type <> 'LOST' OR pet_id IS NOT NULL"
        - addCheckConstraint:
            tableName: lost_found_advertisement
            constraintName: chk_lf_found_no_pet
            constraintCheck: "advertisement_type <> 'FOUND' OR pet_id IS NULL"
        - addCheckConstraint:
            tableName: lost_found_advertisement
            constraintName: chk_lf_reward_positive
            constraintCheck: "reward_amount_irr IS NULL OR reward_amount_irr > 0"
        - addCheckConstraint:
            tableName: lost_found_advertisement
            constraintName: chk_lf_phone_when_contact_phone
            constraintCheck: "contact_method <> 'PHONE' OR contact_phone_e164 IS NOT NULL"
        - createIndex:
            tableName: lost_found_advertisement
            indexName: idx_lf_public_search
            columns:
              - column: { name: status }
              - column: { name: advertisement_type }
              - column: { name: incident_at }
        - createIndex:
            tableName: lost_found_advertisement
            indexName: idx_lf_city
            columns:
              - column: { name: city }
        - createIndex:
            tableName: lost_found_advertisement
            indexName: idx_lf_owner
            columns:
              - column: { name: user_id }
              - column: { name: created_at }
        - createIndex:
            tableName: lost_found_advertisement
            indexName: idx_lf_expiry_scan
            columns:
              - column: { name: expires_at }
        - sql:
            sql: |
              -- At most one ad can be awaiting payment per pet at a time.
              CREATE UNIQUE INDEX uq_lf_one_payment_pending_per_pet
                ON lost_found_advertisement (pet_id)
               WHERE status = 'PAYMENT_PENDING' AND pet_id IS NOT NULL;
      rollback:
        - dropTable: { tableName: lost_found_advertisement }
        - sql:
            sql: |
              DROP TYPE lost_found_ad_type;
              DROP TYPE lost_found_ad_status;
              DROP TYPE lost_found_species;
              DROP TYPE lost_found_sex;
              DROP TYPE location_precision;
              DROP TYPE contact_method;
