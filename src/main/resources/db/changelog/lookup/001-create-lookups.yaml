databaseChangeLog:
  - changeSet:
      id: lookup-001-create-tbl-lookups
      author: benji
      changes:
        - createTable:
            tableName: tbl_lookups
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: category
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: int
        - addUniqueConstraint:
            constraintName: uq_lookups_category_code
            tableName: tbl_lookups
            columnNames: category, code
        - createIndex:
            indexName: idx_lookups_category
            tableName: tbl_lookups
            columns:
              - column:
                  name: category
      rollback:
        - dropTable:
            tableName: tbl_lookups
