databaseChangeLog:
  - changeSet:
      id: user-005-add-avatar-columns
      author: benji
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: avatar_object_key
                  type: varchar(200)
              - column:
                  name: avatar_content_type
                  type: varchar(50)
      rollback:
        - dropColumn:
            tableName: users
            columnName: avatar_object_key
        - dropColumn:
            tableName: users
            columnName: avatar_content_type
